<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>FTDI breakout to WT32-ETH01 serial wiring</title>
<desc>Four connections: GND to GND, VCC 3V3 to 3V3, and the two data lines crossed, FTDI TX to ESP32 RX0 and FTDI RX to ESP32 TX0.</desc>
<rect x="0" y="0" width="680" height="400" fill="#FFFFFF"/>

<rect x="50" y="60" width="180" height="270" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="140" y="92" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">FTDI breakout</text>
<text x="140" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Watterott, 3.3 V</text>

<text x="222" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">GND</text>
<text x="222" y="200" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">VCC</text>
<text x="222" y="250" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">TX</text>
<text x="222" y="300" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">RX</text>

<line x1="230" y1="150" x2="450" y2="150" stroke="#2C2C2A" stroke-width="3" stroke-linecap="round"/>
<line x1="230" y1="200" x2="450" y2="200" stroke="#D32F2F" stroke-width="3" stroke-linecap="round"/>
<line x1="230" y1="250" x2="450" y2="300" stroke="#E8A317" stroke-width="3" stroke-linecap="round"/>
<line x1="230" y1="300" x2="450" y2="250" stroke="#2E6DB4" stroke-width="3" stroke-linecap="round"/>

<rect x="450" y="60" width="180" height="270" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="540" y="92" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">WT32-ETH01</text>
<text x="540" y="112" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ESP32 side</text>

<text x="462" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2C2C2A" dominant-baseline="central">GND</text>
<text x="462" y="200" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2C2C2A" dominant-baseline="central">3V3</text>
<text x="462" y="250" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2C2C2A" dominant-baseline="central">TX0</text>
<text x="462" y="300" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2C2C2A" dominant-baseline="central">RX0</text>

<text x="340" y="365" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">TX and RX cross over &#183; GND and 3V3 run straight</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>DS18B20 wiring to WT32-ETH01</title>
<desc>Red VDD to 3V3, yellow DATA to GPIO4, black GND to GND, with a 4.7 kilohm pull-up resistor bridging DATA to 3V3 at the board end.</desc>
<rect x="0" y="0" width="680" height="380" fill="#FFFFFF"/>

<rect x="50" y="60" width="190" height="240" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="145" y="90" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">WT32-ETH01</text>
<text x="145" y="110" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">ESP32 side</text>

<text x="232" y="120" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">3V3</text>
<text x="232" y="180" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">GPIO4</text>
<text x="232" y="240" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2C2C2A" text-anchor="end" dominant-baseline="central">GND</text>

<line x1="240" y1="120" x2="500" y2="120" stroke="#D32F2F" stroke-width="3" stroke-linecap="round"/>
<line x1="240" y1="180" x2="500" y2="180" stroke="#E8A317" stroke-width="3" stroke-linecap="round"/>
<line x1="240" y1="240" x2="500" y2="240" stroke="#2C2C2A" stroke-width="3" stroke-linecap="round"/>

<line x1="330" y1="120" x2="330" y2="180" stroke="#5F5E5A" stroke-width="1.5"/>
<rect x="318" y="134" width="24" height="32" rx="4" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="1.2"/>
<circle cx="330" cy="120" r="4.5" fill="#D32F2F"/>
<circle cx="330" cy="180" r="4.5" fill="#E8A317"/>
<text x="356" y="144" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">4.7 k&#937;</text>
<text x="356" y="162" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" dominant-baseline="central">pull-up</text>

<rect x="500" y="90" width="100" height="180" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text x="550" y="76" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">DS18B20</text>

<text x="610" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" dominant-baseline="central">VDD</text>
<text x="610" y="180" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" dominant-baseline="central">DATA</text>
<text x="610" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" dominant-baseline="central">GND</text>

<text x="340" y="330" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Red = VDD &#183; yellow = data &#183; black = GND</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>USB-C breakout wiring with CC pull-down resistors</title>
<desc>A USB-C charger connects to a USB-C breakout board. Pad V goes to the 5V pin of the WT32-ETH01. Pads A5 and B5, which are CC1 and CC2, each connect through a separate 5.1 kilohm resistor to the ground rail, which also carries pad G and feeds the GND pin of the WT32-ETH01. Pads D minus and D plus are unused.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="330" fill="#FAF9F5"/>

<rect x="40" y="130" width="160" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="120" y="157" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">USB-C charger</text>
<text x="120" y="176" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A">5 V, &#8805;1 A</text>

<line x1="202" y1="160" x2="226" y2="160" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="230" y="40" width="240" height="230" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="350" y="63" text-anchor="middle" font-size="14" font-weight="500" fill="#3D3D3A">USB-C breakout</text>

<rect x="250" y="70" width="90" height="28" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="295" y="88" text-anchor="middle" font-size="12" font-weight="400" fill="#633806">V</text>

<rect x="250" y="110" width="90" height="28" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="295" y="128" text-anchor="middle" font-size="12" font-weight="400" fill="#0C447C">G</text>

<rect x="250" y="150" width="90" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="295" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#085041">A5 (CC1)</text>

<rect x="250" y="190" width="90" height="28" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="295" y="208" text-anchor="middle" font-size="12" font-weight="400" fill="#085041">B5 (CC2)</text>

<rect x="365" y="150" width="60" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="395" y="168" text-anchor="middle" font-size="12" font-weight="400" fill="#712B13">5.1 k&#937;</text>

<rect x="365" y="190" width="60" height="28" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="395" y="208" text-anchor="middle" font-size="12" font-weight="400" fill="#712B13">5.1 k&#937;</text>

<line x1="342" y1="164" x2="363" y2="164" stroke="#888780" stroke-width="1"/>
<line x1="342" y1="204" x2="363" y2="204" stroke="#888780" stroke-width="1"/>
<line x1="427" y1="164" x2="440" y2="164" stroke="#888780" stroke-width="1"/>
<line x1="427" y1="204" x2="440" y2="204" stroke="#888780" stroke-width="1"/>
<line x1="342" y1="124" x2="440" y2="124" stroke="#378ADD" stroke-width="1"/>
<line x1="440" y1="124" x2="440" y2="204" stroke="#378ADD" stroke-width="1"/>

<text x="295" y="246" text-anchor="middle" font-size="12" font-weight="400" fill="#73726C">D&#8722;, D+ unused</text>

<line x1="342" y1="84" x2="556" y2="84" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<line x1="440" y1="204" x2="556" y2="204" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

<rect x="540" y="40" width="120" height="230" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="600" y="63" text-anchor="middle" font-size="14" font-weight="500" fill="#3D3D3A">WT32-ETH01</text>

<rect x="560" y="70" width="80" height="28" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="600" y="88" text-anchor="middle" font-size="12" font-weight="400" fill="#633806">5V</text>

<rect x="560" y="190" width="80" height="28" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="600" y="208" text-anchor="middle" font-size="12" font-weight="400" fill="#0C447C">GND</text>

<text x="340" y="305" text-anchor="middle" font-size="12" font-weight="400" fill="#73726C">Each CC pad gets its own resistor to ground &#8212; never bridge A5 to B5</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Pre-fitted USB-C breakout wired to WT32-ETH01</title>
<desc>A USB-C charger connects by a C-to-C cable to a USB-C breakout board that already has its CC pull-down resistors fitted. The board's VBUS pad goes to the 5V pin of the WT32-ETH01 and its GND pad goes to the GND pin. No resistors need to be added.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="250" fill="#FAF9F5"/>

<rect x="40" y="90" width="170" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="125" y="117" text-anchor="middle" font-size="14" font-weight="500" fill="#444441">USB-C charger</text>
<text x="125" y="136" text-anchor="middle" font-size="12" font-weight="400" fill="#5F5E5A">C-to-C cable</text>

<line x1="212" y1="120" x2="246" y2="120" stroke="#73726C" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="250" y="50" width="200" height="140" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="350" y="77" text-anchor="middle" font-size="14" font-weight="500" fill="#3D3D3A">USB-C breakout</text>

<rect x="270" y="90" width="160" height="28" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="350" y="108" text-anchor="middle" font-size="12" font-weight="400" fill="#633806">VBUS / + (5 V)</text>

<rect x="270" y="124" width="160" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="350" y="140" text-anchor="middle" font-size="12" font-weight="400" fill="#085041">CC resistors on board</text>

<rect x="270" y="154" width="160" height="28" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="350" y="172" text-anchor="middle" font-size="12" font-weight="400" fill="#0C447C">GND / &#8722;</text>

<line x1="432" y1="104" x2="536" y2="104" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
<line x1="432" y1="168" x2="536" y2="168" stroke="#378ADD" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

<rect x="520" y="50" width="120" height="140" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="580" y="77" text-anchor="middle" font-size="14" font-weight="500" fill="#3D3D3A">WT32-ETH01</text>

<rect x="540" y="90" width="80" height="28" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="580" y="108" text-anchor="middle" font-size="12" font-weight="400" fill="#633806">5V</text>

<rect x="540" y="154" width="80" height="28" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="580" y="172" text-anchor="middle" font-size="12" font-weight="400" fill="#0C447C">GND</text>

<text x="340" y="220" text-anchor="middle" font-size="12" font-weight="400" fill="#73726C">Nothing to solder except the header &#8212; pads output 5 V directly</text>
</svg>
